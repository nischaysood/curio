org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.parallel=true

# Configuration cache OFF on purpose. It is a known source of intermittent,
# hard-to-read failures with KMP + AGP, and it saves seconds on a project this
# small. Not worth debugging a phantom cache bug on Aug 14. Revisit after ship.
org.gradle.configuration-cache=false

android.nonTransitiveRClass=true
android.useAndroidX=true

# AGP 8.7.3 predates API 36 and warns that it hasn't been tested against it.
# Play requires targetSdk 36, and upgrading AGP would cascade into Kotlin and
# Compose Multiplatform. Suppressing the warning is the smaller risk.
android.suppressUnsupportedCompileSdk=36

kotlin.daemon.jvmargs=-Xmx3072M

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
